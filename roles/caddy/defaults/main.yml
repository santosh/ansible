---
# Path to a file containing `CLOUDFLARE_API_TOKEN=...`, scoped to DNS edit on
# the zone(s) covering every fqdn in caddy_vhosts. Deployed to the host
# out-of-band, never through ansible, so the token itself never passes
# through this repo.
caddy_cloudflare_env_file: /etc/caddy/cloudflare.env

# Bind only to the tailnet address so nothing is exposed on the public interface.
# Set to "" to listen on all interfaces instead.
caddy_bind_address: "{{ ansible_tailscale0.ipv4.address | default('') }}"

# One Caddy site block per fqdn. Each is validated via Cloudflare DNS-01, so
# no inbound port 80/443 is ever required - the domain can (and should)
# still resolve only to this node's tailnet address.
#
# Every service gets its own subdomain, proxied whole - no path-prefix
# routing. Stripping a prefix breaks any backend that builds absolute URLs,
# and a new subdomain costs only a DNS record, so there is no reason to share
# one fqdn between services.
#
# `upstream` may be any address reachable *from oracle* - a tailnet peer or
# a service on oracle itself (127.0.0.1:port). Set `host_header` when the
# backend validates the Host header and would reject the public fqdn.
caddy_vhosts:
  - fqdn: vikunja.muresine.top
    upstream: 100.118.241.39:4444
