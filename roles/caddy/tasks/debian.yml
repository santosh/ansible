- name: install prerequisites for the caddy apt repo
  apt:
    name:
      - debian-keyring
      - debian-archive-keyring
      - apt-transport-https
      - curl
      - gpg
    state: present
    update_cache: yes

- name: fetch caddy repo signing key
  get_url:
    url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
    dest: /tmp/caddy-stable.asc
    mode: "0644"

- name: dearmor caddy repo signing key
  command: gpg --batch --yes --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg /tmp/caddy-stable.asc
  args:
    creates: /usr/share/keyrings/caddy-stable-archive-keyring.gpg

- name: add caddy apt repository
  apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/caddy-stable-archive-keyring.gpg] https://dl.cloudsmith.io/public/caddy/stable/deb/debian any-version main"
    filename: caddy-stable
    state: present

- name: install caddy on debian
  apt: name=caddy state=present update_cache=yes

# The apt package ships vanilla caddy with no DNS provider modules. Overwrite
# its binary with a build that adds the cloudflare module, needed for DNS-01
# challenges against every fqdn in caddy_vhosts. A future `apt upgrade` of the
# package will silently revert this file to vanilla again - re-running this
# role restores the custom build, since get_url only redeploys on checksum
# mismatch.
- name: download caddy build with cloudflare dns plugin
  get_url:
    url: "https://caddyserver.com/api/download?os=linux&arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}&p=github.com%2Fcaddy-dns%2Fcloudflare"
    dest: /usr/bin/caddy
    owner: root
    group: root
    mode: "0755"
  notify: restart caddy