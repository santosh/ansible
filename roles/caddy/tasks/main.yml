- include_tasks: debian.yml
  when: ansible_os_family == "Debian"

- name: fail early if tailscale is not up
  command: tailscale status --json
  register: caddy_ts_status
  changed_when: false

- name: stop and disable old tailscale-cert renewal timer
  service:
    name: tailscale-cert.timer
    state: stopped
    enabled: no
  failed_when: false

- name: remove old tailscale-cert systemd units
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/tailscale-cert.service
    - /etc/systemd/system/tailscale-cert.timer
  notify: reload systemd

- name: remove old tailscale-issued certificate directory
  file:
    path: /var/lib/caddy/tailscale
    state: absent

- name: create caddy systemd override directory
  file:
    path: /etc/systemd/system/caddy.service.d
    state: directory
    mode: "0755"

- name: install caddy systemd override for cloudflare token
  template:
    src: caddy-cloudflare-token.conf.j2
    dest: /etc/systemd/system/caddy.service.d/override.conf
    mode: "0644"
  notify:
    - reload systemd
    - restart caddy

- name: flush handlers so the override is active before caddy first starts
  meta: flush_handlers

- name: create caddy log directory
  file:
    path: /var/log/caddy
    state: directory
    owner: caddy
    group: caddy
    mode: "0750"

- name: ensure access log exists owned by caddy before validate touches it
  file:
    path: /var/log/caddy/access.log
    state: touch
    owner: caddy
    group: caddy
    mode: "0640"
    access_time: preserve
    modification_time: preserve

- name: copy Caddyfile
  template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    mode: "0644"
    validate: >-
      bash -c 'set -a; source {{ caddy_cloudflare_env_file }}; set +a;
      caddy validate --adapter caddyfile --config %s'
  notify: reload caddy

- name: start caddy and enable at startup
  service: name=caddy state=started enabled=yes
